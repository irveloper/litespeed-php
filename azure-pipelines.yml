# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Validate
  displayName: Validate
  jobs:
  - job: Validate
    displayName: Composer validate & lint
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: UsePHPVersion@0
      inputs:
        versionSpec: '8.2'
      displayName: Use PHP 8.2

    - script: |
        cd src/php-app
        composer validate --strict
      displayName: Validate composer.json

    - script: |
        cd src/php-app
        find src tests -name '*.php' -print0 | xargs -0 -r php -l
      displayName: PHP syntax lint

    - script: |
        cd src/php-app
        composer install --no-interaction --prefer-dist
        vendor/bin/phpunit --testdox
      displayName: Install deps & run tests

- stage: Build
  displayName: Build image
  dependsOn: Validate
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@2
      displayName: Build an image
      inputs:
        command: build
        dockerfile: '$(Build.SourcesDirectory)/conf/litespeed/Dockerfile'
        tags: |
          $(tag)
